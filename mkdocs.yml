site_name: KFO Server Docs
site_description: Documentation for the official Killing Fever Online server codebase.
site_url: https://killing-fever-online.github.io/kfo-server/
repo_url: https://github.com/Killing-Fever-Online/KFO-Server
repo_name: Killing-Fever-Online/KFO-Server
edit_uri: https://github.com/Killing-Fever-Online/KFO-Server/edit/master/docs/

theme:
  name: material
  # KFO-Wiki look: dark neutral theme with red accents.
  custom_dir: overrides
  logo: img/favicon.ico
  favicon: img/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: red
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - toc.integrate
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.action.new

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - tables
  - toc:
      permalink: true

plugins:
  - search

# Internal planning docs never reach the public site.
exclude_docs: ai/**

nav:
  - Home: index.md
  - Reference:
      - Commands: auto/commands.md
      - Area Prefs: auto/prefs.md
      - Hub Prefs: auto/hub_prefs.md
  - Guides:
      - In-Character Commands: in_character.md
      - Demo Scripting: demo_scripting.md
      - Character URL Guide: url_guide.md